<title>Generador CSV — Licitación 484012</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {

</style>

<body>

<div class="container">

    <h1>Generador CSV — Licitación 484012</h1>
    <div class="subtitle">
        Compatible con diferentes formatos de Cuadro de Precio Adjudicado
    </div>

    <div class="card">

        <label>Archivo Excel</label>

        <div class="dropzone" id="dropzone">

            type="text"
            id="ruc"

        <button id="generateBtn" disabled>
            Generar CSV
        </button>

        <div id="downloadArea"></div>

        <div class="table-wrapper">

        </div>

    </div>

    <div class="card">

        <h3>Depuración</h3>

        <pre id="debug"></pre>

    </div>

</div>

<script>

const OUTPUT_HEADERS = [
    "Número Lote",
    "Número Grupo",
    "Número Item",
    "Código de Producto",
    "Grupo Descripción",
    "Nombre del Producto",
    "Cantidad",
    "Contrato Abierto",
    "Abastecimiento Simultáneo",
    "Tipo Contrato Abierto",
    "Cantidad Adjudicada",
    "Porcentaje de Distribución",
    "Precio Unitario Adjudicado",
    "Atributo",
    "Descripción Atributo"
];

/*
    Hojas que nunca deben procesarse.
*/
const IGNORED_SHEETS = new Set([
    "ítems (3)",
    "items (3)"
]);

let workbookData = null;
let parsedData = null;

const fileInput = document.getElementById("fileInput");
const dropzone = document.getElementById("dropzone");
const generateBtn = document.getElementById("generateBtn");
const message = document.getElementById("message");
const debug = document.getElementById("debug");
const stats = document.getElementById("stats");
const previewTable = document.getElementById("previewTable");
const downloadArea = document.getElementById("downloadArea");


dropzone.addEventListener("click", () => {
    fileInput.click();
});


fileInput.addEventListener("change", e => {

    if (!e.target.files.length) return;

    processFile(e.target.files[0]);

});


dropzone.addEventListener("dragover", e => {
    e.preventDefault();
});


dropzone.addEventListener("drop", e => {

    e.preventDefault();

    if (!e.dataTransfer.files.length) return;

    processFile(e.dataTransfer.files[0]);

});


function normalize(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/<br\s*\/?>/gi, " ")
        .replace(/&nbsp;/gi, " ")
        .replace(/\u00A0/g, " ")
        .replace(/[‐-‒–—―]/g, "-")
        .replace(/\s+/g, " ")
        .trim();

}


function normalizeHeader(value) {

    return normalize(value)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

}


function cleanCode(value) {

    return normalize(value)
        .replace(/\s+/g, "")
        .replace(/[‐-‒–—―]/g, "-");

}


/*
    Código de catálogo típico:

    72131601-002
    80111613-9999
*/
function isCatalogCode(value) {

    const code = cleanCode(value);

    return /^\d{8}-\d{3,4}$/.test(code);

}


function isPositiveInteger(value) {

    const s = normalize(value);

    if (!/^\d+$/.test(s)) return false;

    const n = Number(s);

    return Number.isInteger(n) && n > 0;

}


function rowText(row) {

    return row
        .map(normalize)
        .filter(Boolean)
        .join(" ");

}


/*
    Detecta encabezados aunque estén:

    Ítem
    Código Catálogo
    Descripción

    o repartidos en varias filas.
*/
function detectHeaderAtRow(rows, start) {

    const maxRows = Math.min(start + 3, rows.length);

    const combined = [];

    for (let c = 0; c < 20; c++) {

        let value = "";

        for (let r = start; r < maxRows; r++) {

            const cell = normalize(rows[r]?.[c]);

            if (cell) {

                value += " " + cell;

            }

        }

        combined[c] = normalizeHeader(value);

    }

    let itemCol = -1;
    let codeCol = -1;
    let descCol = -1;
    let attrCol = -1;
    let qtyCol = -1;
    let charCol = -1;
    let priceCol = -1;

    for (let c = 0; c < combined.length; c++) {

        const h = combined[c];

        if (itemCol === -1 &&
            (
                h === "item" ||
                h.includes("numero item") ||
                h.includes("nro item")
            )
        ) {
            itemCol = c;
        }

        if (codeCol === -1 &&
            (
                h.includes("codigo catalogo") ||
                h.includes("codigo de catalogo") ||
                h === "codigo"
            )
        ) {
            codeCol = c;
        }

        if (descCol === -1 &&
            h.includes("descripcion")
        ) {
            descCol = c;
        }

        if (attrCol === -1 &&
            h === "atributos"
        ) {
            attrCol = c;
        }

        if (qtyCol === -1 &&
            h.includes("cantidad")
        ) {
            qtyCol = c;
        }

        if (charCol === -1 &&
            (
                h.includes("caracteristicas") ||
                h.includes("caracteristica")
            )
        ) {
            charCol = c;
        }

        if (priceCol === -1 &&
            h.includes("precio unitario")
        ) {
            priceCol = c;
        }

    }

    /*
        Incluso si falta alguna columna, consideramos que
        la tabla es válida cuando tenemos al menos Ítem
        y Código Catálogo.
    */
    if (itemCol !== -1 && codeCol !== -1) {

        return {
            row: start,
            itemCol,
            codeCol,
            descCol,
            attrCol,
            qtyCol,
            charCol,
            priceCol
        };

    }

    return null;

}


/*
    Busca el texto de Lote.

    Acepta:

    Lote I
    Lote II
    Lote III
    Lote 1
    Lote 25
    LOTE IV
    etc.
*/
function findLotText(text) {

    const t = normalize(text);

    const match = t.match(
        /\bLote\s+([0-9]+|[IVXLCDM]+)\b/i
    );

    return match ? match[0] : "";

}


function romanToArabic(value) {

    const s = String(value).toUpperCase();

    const values = {
        I: 1,
        V: 5,
        X: 10,
        L: 50,
        C: 100,
        D: 500,
        M: 1000
    };

    let total = 0;
    let prev = 0;

    for (let i = s.length - 1; i >= 0; i--) {

        const current = values[s[i]] || 0;

        if (current < prev) {
            total -= current;
        } else {
            total += current;
        }

        prev = current;

    }

    return total;

}


function parseLotInfo(text) {

    const clean = normalize(text);

    const lotMatch = clean.match(
        /\bLote\s+([0-9]+|[IVXLCDM]+)\b/i
    );

    let lotNumber = "";

    if (lotMatch) {

        const raw = lotMatch[1];

        if (/^\d+$/.test(raw)) {

            lotNumber = Number(raw);

        } else {

            lotNumber = romanToArabic(raw);

        }

    }

    let group = 1;

    const groupMatch = clean.match(
        /\bGrupo\s+(\d+)\b/i
    );

    if (groupMatch) {
        group = Number(groupMatch[1]);
    }

    let simultaneous = "No";

    const simMatch = clean.match(
        /Abastecimiento\s+Simultaneo\s*:\s*([^\s,]+)/i
    );

    if (simMatch) {

        simultaneous =
            /^si$/i.test(simMatch[1])
                ? "Si"
                : "No";

    }

    let contractType = "";

    const contractMatch = clean.match(
        /Contrato\s+Abierto\s*:\s*([^,]+)/i
    );

    if (contractMatch) {

        const value = normalize(contractMatch[1]);

        if (/por monto/i.test(value)) {

            contractType = "Por Monto";

        } else {

            contractType = value;

        }

    }

    return {
        number: lotNumber,
        group,
        simultaneous,
        contractType,
        text: clean
    };

}


/*
    Extrae proveedor buscando TODAS las filas.
*/
function findProviderInSheet(rows) {

    for (let r = 0; r < rows.length; r++) {

        for (let c = 0; c < rows[r].length; c++) {

            const value = normalize(rows[r][c]);

            if (!value) continue;

            if (/^adjudicado\s*:?\s*$/i.test(value)) {

                /*
                    Normalmente el nombre está en la siguiente
                    celda de la misma fila.
                */
                for (let nc = c + 1; nc < rows[r].length; nc++) {

                    const next = normalize(rows[r][nc]);

                    if (next) {
                        return parseProvider(next);
                    }

                }

                /*
                    En caso de estar debajo.
                */
                for (let nr = r + 1; nr < Math.min(r + 3, rows.length); nr++) {

                    const nextRow = rows[nr] || [];

                    for (const cell of nextRow) {

                        const next = normalize(cell);

                        if (next) {
                            return parseProvider(next);
                        }

                    }

                }

            }

        }

    }

    return {
        name: "",
        ruc: "",
        ci: ""
    };

}


function parseProvider(value) {

    let name = normalize(value);

    let ruc = "";
    let ci = "";

    const rucMatch = name.match(
        /\bRUC\s*:?\s*([0-9]+-[0-9kK]+)\b/i
    );

    if (rucMatch) {

        ruc = rucMatch[1];

    }

    const ciMatch = name.match(
        /\bC\.?\s*I\.?\s*N?\.?\s*[°º]?\s*:?\s*([0-9.]+)/i
    );

    if (ciMatch) {

        ci = ciMatch[1];

    }

    /*
        Elimina datos identificatorios del nombre mostrado
        cuando aparecen después de "Con C.I."
    */
    name = name
        .replace(/\s+Con\s+C\.?\s*I\.?.*$/i, "")
        .replace(/\s+RUC\s*:?.*$/i, "")
        .replace(/\s+-\s*$/g, "")
        .trim();

    return {
        name,
        ruc,
        ci
    };

}


/*
    Busca un código de catálogo en cualquier parte de la fila.
*/
function findCatalogCodeInRow(row) {

    for (let c = 0; c < row.length; c++) {

        const code = cleanCode(row[c]);

        if (isCatalogCode(code)) {

            return {
                code,
                col: c
            };

        }

    }

    return null;

}


/*
    Busca el número de ítem más cercano a la izquierda
    del código de catálogo.
*/
function findItemNumber(row, codeCol) {

    /*
        Primero buscamos directamente a la izquierda.
    */
    for (let c = codeCol - 1; c >= 0; c--) {

        const value = normalize(row[c]);

        if (isPositiveInteger(value)) {

            return {
                item: Number(value),
                col: c
            };

        }

        /*
            No cruzar demasiadas columnas.
        */
        if (codeCol - c > 5) break;

    }

    /*
        Si no existe a la izquierda, buscamos toda la fila.
    */
    for (let c = 0; c < row.length; c++) {

        const value = normalize(row[c]);

        if (isPositiveInteger(value)) {

            return {
                item: Number(value),
                col: c
            };

        }

    }

    return null;

}


function parseCharacteristics(value) {

    const text = normalize(value);

    const result = {
        procedencia: "",
        certificado: ""
    };

    if (!text) return result;

    let match = text.match(
        /Procedencia\s*:\s*([^]+?)(?=\s+nro[_\s-]*certificado|$)/i
    );

    if (match) {

        result.procedencia = normalize(match[1]);

    }

    match = text.match(
        /nro[_\s-]*certificado[_\s-]*origen[_\s-]*nacional\s*:\s*([^\s,;]+)/i
    );

    if (match) {

        result.certificado = normalize(match[1]);

    }

    /*
        En algunos Excel "Procedencia" puede venir separada.
    */
    if (!result.procedencia) {

        match = text.match(
            /Procedencia\s*:\s*([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{2,})/i
        );

        if (match) {
            result.procedencia = normalize(match[1]);
        }

    }

    return result;

}


function extractItemsFromSheet(rows, header, lot) {

    const items = [];

    if (!header || !lot) {
        return items;
    }

    for (
        let r = header.row + 1;
        r < rows.length;
        r++
    ) {

        const row = rows[r] || [];

        const text = rowText(row);

        if (!text) continue;

        /*
            Si encontramos otro lote, el parser principal
            se encargará de cambiar de lote.
        */
        if (findLotText(text)) {
            continue;
        }

        /*
            Ignorar encabezados repetidos.
        */
        const normalizedRow = normalizeHeader(text);

        if (
            normalizedRow.includes("codigo catalogo") &&
            normalizedRow.includes("descripcion")
        ) {
            continue;
        }

        /*
            Ignorar totales.
        */
        if (
            /\btotal\b/i.test(text) ||
            /\bsubtotal\b/i.test(text) ||
            /\bobservacion\b/i.test(text) ||
            /\bobservaciones\b/i.test(text)
        ) {
            continue;
        }

        const catalog = findCatalogCodeInRow(row);

        if (!catalog) continue;

        const itemInfo = findItemNumber(row, catalog.col);

        /*
            Un código sin número de ítem no se considera
            adjudicación válida.
        */
        if (!itemInfo) continue;

        let description = "";

        if (
            header.descCol >= 0 &&
            row[header.descCol] !== undefined
        ) {
            description = normalize(row[header.descCol]);
        }

        /*
            Si la columna de descripción no fue encontrada,
            buscar el texto más cercano al código.
        */
        if (!description) {

            for (
                let c = catalog.col + 1;
                c < row.length;
                c++
            ) {

                const value = normalize(row[c]);

                if (!value) continue;

                if (
                    isCatalogCode(value) ||
                    isPositiveInteger(value)
                ) {
                    continue;
                }

                if (
                    /procedencia\s*:/i.test(value) ||
                    /certificado/i.test(value)
                ) {
                    continue;
                }

                description = value;
                break;

            }

        }

        let quantity = "";

        if (
            header.qtyCol >= 0 &&
            row[header.qtyCol] !== undefined
        ) {
            quantity = normalize(row[header.qtyCol]);
        }

        let characteristics = "";

        if (
            header.charCol >= 0 &&
            row[header.charCol] !== undefined
        ) {
            characteristics = normalize(row[header.charCol]);
        }

        /*
            Si no encontramos Caracteristicas,
            buscar en toda la fila.
        */
        if (!characteristics) {

            for (const cell of row) {

                const value = normalize(cell);

                if (
                    /Procedencia\s*:/i.test(value) ||
                    /certificado[_\s-]*origen/i.test(value)
                ) {

                    characteristics +=
                        (characteristics ? " " : "") +
                        value;

                }

            }

        }

        let price = "";

        if (
            header.priceCol >= 0 &&
            row[header.priceCol] !== undefined
        ) {
            price = normalize(row[header.priceCol]);
        }

        const attributes = parseCharacteristics(
            characteristics
        );

        items.push({

            item: itemInfo.item,

            code: catalog.code,

            description,

            quantity,

            price,

            procedencia: attributes.procedencia,

            certificado: attributes.certificado

        });

    }

    return items;

}


/*
    Parser principal.

    IMPORTANTE:

    El lote puede aparecer ANTES del encabezado
    o DESPUÉS del encabezado.

    Por eso currentLot y currentHeader
    son independientes.
*/
function parseSheet(rows, sheetName) {

    const result = [];

    let currentLot = null;
    let currentHeader = null;

    const sheetDebug = [];

    for (let r = 0; r < rows.length; r++) {

        const row = rows[r] || [];

        const text = rowText(row);

        if (!text) continue;

        /*
            1. Detectar lote SIEMPRE.
        */
        const lotText = findLotText(text);

        if (lotText) {

            currentLot = parseLotInfo(text);

            sheetDebug.push(
                `Fila ${r + 1}: LOTE DETECTADO -> ${lotText} | ` +
                `N°=${currentLot.number} | ` +
                `Grupo=${currentLot.group} | ` +
                `${currentLot.contractType} | ` +
                `Simultáneo=${currentLot.simultaneous}`
            );

        }

        /*
            2. Detectar encabezado SIEMPRE.
        */
        const header = detectHeaderAtRow(rows, r);

        if (header) {

            currentHeader = header;

            sheetDebug.push(
                `Fila ${r + 1}: ENCABEZADO DETECTADO -> ` +
                `Ítem=${header.itemCol}, ` +
                `Código=${header.codeCol}, ` +
                `Descripción=${header.descCol}, ` +
                `Atributos=${header.attrCol}, ` +
                `Cantidad=${header.qtyCol}, ` +
                `Características=${header.charCol}, ` +
                `Precio=${header.priceCol}`
            );

        }

        /*
            3. Si tenemos ambos, intentar leer ítems
            desde el encabezado.
        */
        if (currentLot && currentHeader) {

            /*
                Solo procesamos una vez por cada combinación
                de encabezado + lote.
            */
            const key =
                `${currentLot.number}-${currentLot.group}-${currentHeader.row}`;

            if (!result.some(x => x._parseKey === key)) {

                const items =
                    extractItemsFromSheet(
                        rows,
                        currentHeader,
                        currentLot
                    );

                if (items.length) {

                    sheetDebug.push(
                        `Fila ${r + 1}: ` +
                        `${items.length} ÍTEMS DETECTADOS`
                    );

                    result.push({

                        lot: currentLot,

                        header: currentHeader,

                        items,

                        _parseKey: key

                    });

                }

            }

        }

    }

    /*
        Fallback adicional:
        si por alguna razón el encabezado no fue asociado
        al lote, buscamos cualquier tabla válida.
    */
    if (!result.length) {

        for (let r = 0; r < rows.length; r++) {

            const header = detectHeaderAtRow(rows, r);

            if (!header) continue;

            const items = extractItemsFromSheet(
                rows,
                header,
                {
                    number: 1,
                    group: 1,
                    simultaneous: "No",
                    contractType: "",
                    text: sheetName
                }
            );

            if (items.length) {

                sheetDebug.push(
                    `FALLBACK: tabla detectada en fila ${r + 1} ` +
                    `sin lote explícito.`
                );

                result.push({

                    lot: {
                        number: 1,
                        group: 1,
                        simultaneous: "No",
                        contractType: "",
                        text: sheetName
                    },

                    header,

                    items,

                    _parseKey:
                        `fallback-${sheetName}-${r}`

                });

                break;

            }

        }

    }

    return {
        lots: result,
        debug: sheetDebug
    };

}


function extractWorkbook(workbook) {

    const allLots = [];
    const debugLines = [];

    for (const sheetName of workbook.SheetNames) {

        const normalizedSheet =
            normalizeHeader(sheetName);

        if (
            IGNORED_SHEETS.has(normalizedSheet)
        ) {

            debugLines.push(
                `HOJA IGNORADA: "${sheetName}"`
            );

            continue;

        }

        const sheet =
            workbook.Sheets[sheetName];

        const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    header: 1,
                    defval: "",
                    raw: false
                }
            );

        debugLines.push(
            `\n========== HOJA: ${sheetName} ==========\n`
        );

        const provider =
            findProviderInSheet(rows);

        debugLines.push(
            `Proveedor detectado: ${
                provider.name || "(no detectado)"
            }`
        );

        if (provider.ruc) {

            debugLines.push(
                `RUC detectado: ${provider.ruc}`
            );

        }

        if (provider.ci) {

            debugLines.push(
                `C.I. detectada: ${provider.ci}`
            );

        }

        const parsed =
            parseSheet(rows, sheetName);

        for (const line of parsed.debug) {

            debugLines.push(line);

        }

        for (const lot of parsed.lots) {

            lot.provider = provider;
            lot.sheetName = sheetName;

            allLots.push(lot);

        }

    }

    return {
        lots: allLots,
        debug: debugLines
    };

}


function catalogName(code) {

    /*
        Actualmente se conserva el código.
        Si luego tienes una tabla de códigos/nombres,

}


function escapeCSV(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    const text = String(value);

    if (
        text.includes('"') ||
        text.includes(",") ||
        text.includes("\n") ||
        text.includes("\r")
    ) {

        return '"' +
            text.replace(/"/g, '""') +
            '"';

    }

    return text;

}


function createCSV(rows) {

    const lines = [];

    lines.push(
        OUTPUT_HEADERS
            .map(escapeCSV)
            .join(",")
    );

    for (const row of rows) {

        lines.push(
            OUTPUT_HEADERS
                .map(header =>
                    escapeCSV(row[header])
                )
                .join(",")
        );

    }

    /*
        BOM UTF-8 para que Excel conserve
        Número / Código / Descripción / etc.
    */
    return "\uFEFF" + lines.join("\r\n");

}

function mergeDuplicateLots(lots) {

    const map = new Map();

    for (const lot of lots) {

        const key =
            `${lot.sheetName}__${lot.lot.number}__${lot.lot.group}`;

        if (!map.has(key)) {

            map.set(key, {

                ...lot,

                items: []

            });

        }

        const target = map.get(key);

        for (const item of lot.items) {

            const itemKey =
                `${item.item}__${item.code}`;

            const exists =
                target.items.some(
                    x =>
                        `${x.item}__${x.code}` === itemKey
                );

            if (!exists) {

                target.items.push(item);

            }

        }

    }

    return Array.from(map.values());

}


function showPreview(rows) {

    previewTable.innerHTML = "";

    if (!rows.length) return;

    const thead =
        document.createElement("thead");

    const trHead =
        document.createElement("tr");

    for (const header of OUTPUT_HEADERS) {

        const th =
            document.createElement("th");

        th.textContent = header;

        trHead.appendChild(th);

    }

    thead.appendChild(trHead);

    previewTable.appendChild(thead);


    const tbody =
        document.createElement("tbody");

    /*
        Mostrar máximo 300 filas en pantalla.
    */
    for (
        const row of rows.slice(0, 300)
    ) {

        const tr =
            document.createElement("tr");

        for (const header of OUTPUT_HEADERS) {

            const td =
                document.createElement("td");

            td.textContent =
                row[header] ?? "";

            tr.appendChild(td);

        }

        tbody.appendChild(tr);

    }

    previewTable.appendChild(tbody);

}


function setMessage(type, text) {

}


function updateStats(lots, rows) {

    const itemCount =
        lots.reduce(
            (sum, lot) =>

    const lotCount =

    stats.innerHTML = `

    `;

}


function createDownload(csv) {

    downloadArea.innerHTML = "";

    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "licitacion_484012.csv";

    link.textContent =
        "⬇ Descargar CSV";

    link.style.display =
        "inline-block";

    link.style.marginTop =
        "10px";

    link.style.background =
        "#059669";

    link.style.padding =
        "12px 20px";

    link.style.borderRadius =
        "8px";

    link.style.color =
        "white";

    link.style.textDecoration =
        "none";

    link.style.fontWeight =
        "bold";

    downloadArea.appendChild(link);

}


async function processFile(file) {

    setMessage(
        "success",
        "Leyendo Excel..."
    );

    debug.textContent = "";
    stats.innerHTML = "";
    previewTable.innerHTML = "";
    downloadArea.innerHTML = "";

    try {

        const buffer =
            await file.arrayBuffer();

        workbookData =
            XLSX.read(
                buffer,
                {
                    type: "array"
                }
            );

        const result =
            extractWorkbook(workbookData);

        const lots =
            mergeDuplicateLots(
                result.lots
            );

        parsedData = {
            lots,
            debug: result.debug
        };

        debug.textContent =
            result.debug.join("\n");

        if (!lots.length) {

            setMessage(
                "error",
                "Error: El Excel fue abierto correctamente, pero no se detectaron lotes con ítems adjudicados."
            );

            generateBtn.disabled = true;

            return;

        }

        const itemCount =
            lots.reduce(
                (sum, lot) =>
                    sum + lot.items.length,
                0
            );

        setMessage(
            "success",
            `Excel procesado correctamente. ` +
            `Se detectaron ${lots.length} lote(s) ` +
            `y ${itemCount} ítem(s).`
        );

        generateBtn.disabled = false;

    } catch (error) {

        console.error(error);

        setMessage(
            "error",
            "Error al leer el Excel: " +
            error.message
        );

        debug.textContent =
            error.stack || String(error);

        generateBtn.disabled = true;

    }

}


generateBtn.addEventListener(
    "click",
    () => {

        if (!parsedData || !parsedData.lots.length) {

            setMessage(
                "error",
                "No hay datos para generar."
            );

            return;

        }

        try {

            const rows =
                buildCSVRows(
                    parsedData.lots
                );

            const csv =
                createCSV(rows);

            createDownload(csv);

            showPreview(rows);

            updateStats(
                parsedData.lots,
                rows
            );

            setMessage(
                "success",
                `CSV generado correctamente: ` +
                `${rows.length} filas.`
            );

        } catch (error) {

            console.error(error);

            setMessage(
                "error",
                "Error al generar el CSV: " +
                error.message
            );

        }

    }
);
