<script>

const OUTPUT_HEADERS = [

    "Número Lote",
    "Número Grupo",
    "Número Item",
    "Código de Producto",
    "Grupo Descripción",
    "Nombre del Producto",
    "Cantidad",
    "Contrato Abierto",
    "Abastecimiento Simultáneo",
    "Tipo Contrato Abierto",
    "Cantidad Adjudicada",
    "Porcentaje de Distribución",
    "Precio Unitario Adjudicado",
    "Atributo",
    "Descripción Atributo"

];


const IGNORED_SHEETS = new Set([
    "ítems (3)",
    "items (3)"
]);


let workbook = null;
let parsedLots = [];


const fileInput =
    document.getElementById("fileInput");

const dropzone =
    document.getElementById("dropzone");

const generateBtn =
    document.getElementById("generateBtn");

const message =
    document.getElementById("message");

const debug =
    document.getElementById("debug");

const stats =
    document.getElementById("stats");

const previewTable =
    document.getElementById("previewTable");

const downloadArea =
    document.getElementById("downloadArea");


dropzone.addEventListener("click", () => {
    fileInput.click();
});


fileInput.addEventListener("change", e => {

    if (!e.target.files.length) return;

    processFile(e.target.files[0]);

});


dropzone.addEventListener("dragover", e => {

    e.preventDefault();

});


dropzone.addEventListener("drop", e => {

    e.preventDefault();

    if (!e.dataTransfer.files.length) return;

    processFile(e.dataTransfer.files[0]);

});


function normalize(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/<br\s*\/?>/gi, " ")
        .replace(/&nbsp;/gi, " ")
        .replace(/\u00A0/g, " ")
        .replace(/[‐-‒–—―]/g, "-")
        .replace(/\s+/g, " ")
        .trim();

}


function headerNormalize(value) {

    return normalize(value)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

}


function rowText(row) {

    return row
        .map(normalize)
        .filter(Boolean)
        .join(" ");

}


function cleanCode(value) {

    return normalize(value)
        .replace(/\s+/g, "")
        .replace(/[‐-‒–—―]/g, "-");

}


/*
    Códigos de catálogo.

    Ejemplos reales del archivo:

    72131601-002
    80111613-9999
*/
function isCatalogCode(value) {

    const code = cleanCode(value);

    return /^\d{8}-\d{3,4}$/.test(code);

}


function isInteger(value) {

    const s = normalize(value);

    return /^\d+$/.test(s);

}


function romanToNumber(value) {

    const roman = String(value).toUpperCase();

    const map = {
        I: 1,
        V: 5,
        X: 10,
        L: 50,
        C: 100,
        D: 500,
        M: 1000
    };

    let result = 0;
    let previous = 0;

    for (
        let i = roman.length - 1;
        i >= 0;
        i--
    ) {

        const current = map[roman[i]] || 0;

        if (current < previous) {
            result -= current;
        } else {
            result += current;
        }

        previous = current;

    }

    return result;

}


/*
    Detecta:

    Lote I
    Lote II
    Lote III
    Lote 1
    Lote 25
*/
function getLotInfo(text) {

    const clean = normalize(text);

    const match = clean.match(
        /\bLote\s+([0-9]+|[IVXLCDM]+)\b/i
    );

    if (!match) {
        return null;
    }

    const rawNumber = match[1];

    let number;

    if (/^\d+$/.test(rawNumber)) {

        number = Number(rawNumber);

    } else {

        number = romanToNumber(rawNumber);

    }

    let group = 1;

    const groupMatch = clean.match(
        /\bGrupo\s+(\d+)\b/i
    );

    if (groupMatch) {
        group = Number(groupMatch[1]);
    }

    let simultaneous = "No";

    const simultaneousMatch =
        clean.match(
            /Abastecimiento\s+Simultaneo\s*:\s*(Si|No)/i
        );

    if (simultaneousMatch) {

        simultaneous =
            /^si$/i.test(
                simultaneousMatch[1]
            )
                ? "Si"
                : "No";

    }

    let contractType = "";

    const contractMatch =
        clean.match(
            /Contrato\s+Abierto\s*:\s*([^,]+)/i
        );

    if (contractMatch) {

        const contract =
            normalize(contractMatch[1]);

        if (/por monto/i.test(contract)) {

            contractType = "Por Monto";

        } else {

            contractType = contract;

        }

    }

    return {

        number,

        group,

        simultaneous,

        contractType,

        text: clean

    };

}


/*
    Encuentra proveedor.
*/
function findProvider(rows) {

    for (
        let r = 0;
        r < rows.length;
        r++
    ) {

        const row = rows[r] || [];

        for (
            let c = 0;
            c < row.length;
            c++
        ) {

            const value =
                normalize(row[c]);

            if (
                /^Adjudicado\s*:?\s*$/i.test(value)
            ) {

                /*
                    Normalmente está en la siguiente
                    columna.
                */
                for (
                    let x = c + 1;
                    x < row.length;
                    x++
                ) {

                    const next =
                        normalize(row[x]);

                    if (next) {

                        return cleanProvider(
                            next
                        );

                    }

                }

            }

        }

    }

    return {
        name: "",
        ruc: "",
        ci: ""
    };

}


function cleanProvider(value) {

    let text = normalize(value);

    let ruc = "";
    let ci = "";

    const rucMatch =
        text.match(
            /\bRUC\s*:?\s*([0-9]+-[0-9kK]+)\b/i
        );

    if (rucMatch) {
        ruc = rucMatch[1];
    }

    const ciMatch =
        text.match(
            /C\.?\s*I\.?\s*N?\.?\s*[°º]?\s*:?\s*([0-9.]+)/i
        );

    if (ciMatch) {
        ci = ciMatch[1];
    }

    text = text
        .replace(
            /\s+Con\s+C\.?\s*I\.?.*$/i,
            ""
        )
        .replace(
            /\s+RUC\s*:?.*$/i,
            ""
        )
        .replace(
            /\s+-\s*$/g,
            ""
        )
        .trim();

    return {
        name: text,
        ruc,
        ci
    };

}


/*
    Detecta las columnas por encabezados.

    NO es obligatorio utilizar todas.
*/
function detectColumns(rows, headerRow) {

    const result = {

        item: -1,
        code: -1,
        description: -1,
        attributes: -1,
        quantity: -1,
        characteristics: -1,
        price: -1

    };


    /*
        Miramos hasta 3 filas para soportar
        encabezados partidos.
    */
    for (
        let c = 0;
        c < 30;
        c++
    ) {

        let combined = "";

        for (
            let r = headerRow;
            r < Math.min(
                headerRow + 3,
                rows.length
            );
            r++
        ) {

            combined +=
                " " +
                normalize(
                    rows[r]?.[c]
                );

        }

        const h =
            headerNormalize(combined);


        if (
            result.item === -1 &&
            (
                h === "item" ||
                h.includes("numero item") ||
                h.includes("nro item")
            )
        ) {

            result.item = c;

        }


        if (
            result.code === -1 &&
            (
                h.includes("codigo catalogo") ||
                h.includes("codigo de catalogo")
            )
        ) {

            result.code = c;

        }


        if (
            result.description === -1 &&
            h.includes("descripcion")
        ) {

            result.description = c;

        }


        if (
            result.attributes === -1 &&
            h.includes("atributos")
        ) {

            result.attributes = c;

        }


        if (
            result.quantity === -1 &&
            h === "cantidad"
        ) {

            result.quantity = c;

        }


        if (
            result.characteristics === -1 &&
            (
                h.includes("caracteristica") ||
                h.includes("caracteristicas")
            )
        ) {

            result.characteristics = c;

        }


        if (
            result.price === -1 &&
            h.includes("precio unitario")
        ) {

            result.price = c;

        }

    }


    return result;

}


/*
    Busca encabezados en toda la hoja.
*/
function findHeaderRows(rows) {

    const headers = [];

    for (
        let r = 0;
        r < rows.length;
        r++
    ) {

        const columns =
            detectColumns(rows, r);

        /*
            Para considerar que es una tabla,
            basta Ítem + Código Catálogo.
        */
        if (
            columns.item !== -1 &&
            columns.code !== -1
        ) {

            headers.push({

                row: r,
                columns

            });

        }

    }

    return headers;

}


/*
    Encuentra código en cualquier columna.
*/
function findCode(row) {

    for (
        let c = 0;
        c < row.length;
        c++
    ) {

        const code =
            cleanCode(row[c]);

        if (isCatalogCode(code)) {

            return {
                code,
                col: c
            };

        }

    }

    return null;

}


/*
    Encuentra número de ítem.

    Primero busca hacia la izquierda
    del código.
*/
function findItem(row, codeCol) {

    for (
        let c = codeCol - 1;
        c >= 0;
        c--
    ) {

        const value =
            normalize(row[c]);

        if (
            isInteger(value) &&
            Number(value) > 0
        ) {

            return Number(value);

        }

        if (
            codeCol - c >= 5
        ) {
            break;
        }

    }

    /*
        Segunda búsqueda.
    */
    for (
        let c = 0;
        c < row.length;
        c++
    ) {

        const value =
            normalize(row[c]);

        if (
            isInteger(value) &&
            Number(value) > 0
        ) {

            return Number(value);

        }

    }

    return null;

}


/*
    Obtiene descripción.

    Primero usa la columna detectada.
    Si no existe, busca texto alrededor del código.
*/
function findDescription(
    row,
    columns,
    codeCol
) {

    if (
        columns.description !== -1
    ) {

        const value =
            normalize(
                row[columns.description]
            );

        if (value) {
            return value;
        }

    }


    /*
        Buscar después del código.
    */
    for (
        let c = codeCol + 1;
        c < row.length;
        c++
    ) {

        const value =
            normalize(row[c]);

        if (!value) continue;

        if (
            isCatalogCode(value) ||
            isInteger(value)
        ) {
            continue;
        }

        if (
            /Procedencia\s*:/i.test(value) ||
            /certificado.*origen/i.test(value)
        ) {
            continue;
        }

        if (
            /unidad\s+de\s+medida\s*:/i.test(value)
        ) {
            continue;
        }

        return value;

    }

    return "";

}


/*
    Características.
*/
function findCharacteristics(
    row,
    columns
) {

    let text = "";

    if (
        columns.characteristics !== -1
    ) {

        text =
            normalize(
                row[columns.characteristics]
            );

    }


    /*
        Si no está en la columna esperada,
        buscamos Procedencia o certificado
        en toda la fila.
    */
    if (
        !text ||
        (
            !/Procedencia\s*:/i.test(text) &&
            !/certificado.*origen/i.test(text)
        )
    ) {

        const parts = [];

        for (const cell of row) {

            const value =
                normalize(cell);

            if (
                /Procedencia\s*:/i.test(value) ||
                /certificado.*origen/i.test(value)
            ) {

                parts.push(value);

            }

        }

        if (parts.length) {

            text =
                parts.join(" ");

        }

    }

    return text;

}


/*
    Extrae atributos.
*/
function parseAttributes(text) {

    const result = {

        procedencia: "",
        certificado: ""

    };


    const proc =
        text.match(
            /Procedencia\s*:\s*(.*?)(?=\s+nro[_\s-]*certificado|$)/i
        );

    if (proc) {

        result.procedencia =
            normalize(proc[1]);

    }


    const cert =
        text.match(
            /nro[_\s-]*certificado[_\s-]*origen[_\s-]*nacional\s*:\s*([^\s,;]+)/i
        );

    if (cert) {

        result.certificado =
            normalize(cert[1]);

    }


    return result;

}


/*
    IMPORTANTE:

    Este es el nuevo algoritmo principal.

    No depende de que el lote esté antes
    o después del encabezado.
*/
function parseSheet(rows, sheetName) {

    const debugLines = [];

    const headers =
        findHeaderRows(rows);

    debugLines.push(
        `Hoja "${sheetName}": ${headers.length} encabezado(s) encontrado(s).`
    );


    /*
        Primero localizamos TODAS las filas
        que contienen "Lote".
    */
    const lotPositions = [];

    for (
        let r = 0;
        r < rows.length;
        r++
    ) {

        const text =
            rowText(rows[r] || []);

        const lot =
            getLotInfo(text);

        if (lot) {

            lotPositions.push({

                row: r,
                lot

            });

            debugLines.push(
                `Lote detectado en fila ${r + 1}: ` +
                `Lote ${lot.number}, Grupo ${lot.group}`
            );

        }

    }


    const results = [];


    /*
        Para cada encabezado encontramos
        el lote correspondiente.

        Esto permite ambos formatos:

        FORMATO A:
        encabezado
        lote
        ítems

        FORMATO B:
        lote
        encabezado
        ítems
    */
    for (
        let h = 0;
        h < headers.length;
        h++
    ) {

        const header =
            headers[h];

        const nextHeaderRow =
            h + 1 < headers.length
                ? headers[h + 1].row
                : rows.length;


        /*
            Buscar el lote más cercano al encabezado.
        */
        let selectedLot = null;
        let bestDistance = Infinity;


        for (const lp of lotPositions) {

            /*
                El lote debe estar razonablemente
                cerca del encabezado.

                Permitimos lote antes o después.
            */
            const distance =
                Math.abs(
                    lp.row - header.row
                );

            if (
                distance < bestDistance &&
                distance <= 15
            ) {

                selectedLot = lp.lot;
                bestDistance = distance;

            }

        }


        /*
            Si no hay lote cercano, intentar
            buscarlo hacia adelante hasta el
            siguiente encabezado.
        */
        if (!selectedLot) {

            for (
                let r = header.row;
                r < nextHeaderRow;
                r++
            ) {

                const lot =
                    getLotInfo(
                        rowText(rows[r] || [])
                    );

                if (lot) {

                    selectedLot = lot;
                    break;

                }

            }

        }


        /*
            Último fallback:
            si hay un único lote en la hoja.
        */
        if (
            !selectedLot &&
            lotPositions.length === 1
        ) {

            selectedLot =
                lotPositions[0].lot;

        }


        if (!selectedLot) {

            debugLines.push(
                `Encabezado fila ${header.row + 1}: ` +
                `NO se pudo asociar a un lote.`
            );

            continue;

        }


        const items = [];


        /*
            El rango comienza DESPUÉS del encabezado.

            Si el lote estaba después del encabezado,
            igual funciona porque simplemente se ignoran
            las filas que no tengan código.
        */
        let startRow =
            header.row + 1;


        /*
            El final será el siguiente encabezado,
            o el final de la hoja.
        */
        let endRow =
            nextHeaderRow;


        for (
            let r = startRow;
            r < endRow;
            r++
        ) {

            const row =
                rows[r] || [];

            const text =
                rowText(row);

            if (!text) continue;


            /*
                Si aparece otro lote antes del
                siguiente encabezado, no usarlo
                como ítem.
            */
            if (getLotInfo(text)) {

                continue;

            }


            /*
                Ignorar encabezados repetidos.
            */
            const normalized =
                headerNormalize(text);

            if (
                normalized.includes(
                    "codigo catalogo"
                ) &&
                normalized.includes(
                    "descripcion"
                )
            ) {

                continue;

            }


            /*
                Buscar código directamente.
            */
            const codeInfo =
                findCode(row);

            if (!codeInfo) {

                continue;

            }


            /*
                Buscar número de ítem.
            */
            const itemNumber =
                findItem(
                    row,
                    codeInfo.col
                );

            if (!itemNumber) {

                continue;

            }


            /*
                Evitar duplicados.
            */
            const duplicate =
                items.some(
                    item =>
                        item.item === itemNumber &&
                        item.code === codeInfo.code
                );

            if (duplicate) {

                continue;

            }


            const description =
                findDescription(
                    row,
                    header.columns,
                    codeInfo.col
                );


            let quantity = "";

            if (
                header.columns.quantity !== -1
            ) {

                quantity =
                    normalize(
                        row[
                            header.columns.quantity
                        ]
                    );

            }


            let price = "";

            if (
                header.columns.price !== -1
            ) {

                price =
                    normalize(
                        row[
                            header.columns.price
                        ]
                    );

            }


            const characteristics =
                findCharacteristics(
                    row,
                    header.columns
                );


            const attributes =
                parseAttributes(
                    characteristics
                );


            items.push({

                item: itemNumber,

                code: codeInfo.code,

                description,

                quantity,

                price,

                procedencia:
                    attributes.procedencia,

                certificado:
                    attributes.certificado

            });

        }


        /*
            FALLBACK MUY IMPORTANTE:

            Si no encontramos ítems usando
            el encabezado, buscamos desde el
            encabezado hasta antes del siguiente
            lote/encabezado.

            Esto hace el sistema todavía más
            tolerante con Excel combinados.
        */
        if (!items.length) {

            const fallbackStart =
                Math.max(
                    0,
                    header.row + 1
                );

            const fallbackEnd =
                Math.min(
                    rows.length,
                    header.row + 500
                );


            for (
                let r = fallbackStart;
                r < fallbackEnd;
                r++
            ) {

                const row =
                    rows[r] || [];

                const codeInfo =
                    findCode(row);

                if (!codeInfo) {
                    continue;
                }


                const itemNumber =
                    findItem(
                        row,
                        codeInfo.col
                    );

                if (!itemNumber) {
                    continue;
                }


                const exists =
                    items.some(
                        item =>
                            item.item === itemNumber &&
                            item.code === codeInfo.code
                    );

                if (exists) {
                    continue;
                }


                const description =
                    findDescription(
                        row,
                        header.columns,
                        codeInfo.col
                    );


                const characteristics =
                    findCharacteristics(
                        row,
                        header.columns
                    );


                const attributes =
                    parseAttributes(
                        characteristics
                    );


                items.push({

                    item: itemNumber,

                    code: codeInfo.code,

                    description,

                    quantity:
                        header.columns.quantity !== -1
                            ? normalize(
                                row[
                                    header.columns.quantity
                                ]
                            )
                            : "",

                    price:
                        header.columns.price !== -1
                            ? normalize(
                                row[
                                    header.columns.price
                                ]
                            )
                            : "",

                    procedencia:
                        attributes.procedencia,

                    certificado:
                        attributes.certificado

                });

            }

        }


        if (items.length) {

            debugLines.push(
                `Lote ${selectedLot.number} ` +
                `/ Grupo ${selectedLot.group}: ` +
                `${items.length} ítems detectados.`
            );


            results.push({

                lot: selectedLot,

                items,

                sheetName

            });

        } else {

            debugLines.push(
                `Lote ${selectedLot.number} ` +
                `/ Grupo ${selectedLot.group}: ` +
                `NO se encontraron ítems.`
            );

        }

    }


    /*
        Si el método anterior no encontró nada,
        realizar una búsqueda TOTAL independiente.

        Esto evita que una estructura inesperada
        del Excel bloquee la importación.
    */
    if (!results.length) {

        debugLines.push(
            "Activando búsqueda independiente de códigos de catálogo..."
        );


        for (const lp of lotPositions) {

            const items = [];


            /*
                Tomamos hasta el próximo lote.
            */
            let end =
                rows.length;

            for (const other of lotPositions) {

                if (
                    other.row > lp.row &&
                    other.row < end
                ) {

                    end = other.row;

                }

            }


            for (
                let r = lp.row + 1;
                r < end;
                r++
            ) {

                const row =
                    rows[r] || [];

                const codeInfo =
                    findCode(row);

                if (!codeInfo) {
                    continue;
                }


                const itemNumber =
                    findItem(
                        row,
                        codeInfo.col
                    );

                if (!itemNumber) {
                    continue;
                }


                const exists =
                    items.some(
                        item =>
                            item.item === itemNumber &&
                            item.code === codeInfo.code
                    );

                if (exists) {
                    continue;
                }


                /*
                    Buscar columnas a partir del
                    encabezado más cercano.
                */
                let columns = {
                    item: -1,
                    code: -1,
                    description: -1,
                    attributes: -1,
                    quantity: -1,
                    characteristics: -1,
                    price: -1
                };


                let closestHeader = null;
                let distance = Infinity;


                for (const h of headers) {

                    const d =
                        Math.abs(
                            h.row - r
                        );

                    if (d < distance) {

                        distance = d;
                        closestHeader = h;

                    }

                }


                if (closestHeader) {

                    columns =
                        closestHeader.columns;

                }


                const description =
                    findDescription(
                        row,
                        columns,
                        codeInfo.col
                    );


                const characteristics =
                    findCharacteristics(
                        row,
                        columns
                    );


                const attributes =
                    parseAttributes(
                        characteristics
                    );


                items.push({

                    item: itemNumber,

                    code: codeInfo.code,

                    description,

                    quantity:
                        columns.quantity !== -1
                            ? normalize(
                                row[
                                    columns.quantity
                                ]
                            )
                            : "",

                    price:
                        columns.price !== -1
                            ? normalize(
                                row[
                                    columns.price
                                ]
                            )
                            : "",

                    procedencia:
                        attributes.procedencia,

                    certificado:
                        attributes.certificado

                });

            }


            if (items.length) {

                debugLines.push(
                    `BÚSQUEDA INDEPENDIENTE: ` +
                    `Lote ${lp.lot.number} ` +
                    `/ Grupo ${lp.lot.group}: ` +
                    `${items.length} ítems.`
                );


                results.push({

                    lot: lp.lot,

                    items,

                    sheetName

                });

            }

        }

    }


    return {
        results,
        debugLines
    };

}


/*
    Combinar duplicados.
*/
function mergeResults(results) {

    const map = new Map();


    for (const result of results) {

        const key =
            `${result.sheetName}__` +
            `${result.lot.number}__` +
            `${result.lot.group}`;


        if (!map.has(key)) {

            map.set(key, {

                sheetName:
                    result.sheetName,

                lot:
                    result.lot,

                items: []

            });

        }


        const target =
            map.get(key);


        for (const item of result.items) {

            const exists =
                target.items.some(
                    x =>
                        x.item === item.item &&
                        x.code === item.code
                );


            if (!exists) {

                target.items.push(item);

            }

        }

    }


    return Array.from(
        map.values()
    );

}


/*
    Procesar todo el workbook.
*/
function parseWorkbook(wb) {

    const allResults = [];
    const debugLines = [];

    for (const sheetName of wb.SheetNames) {

        const normalizedName =
            headerNormalize(sheetName);


        if (
            IGNORED_SHEETS.has(
                normalizedName
            )
        ) {

            debugLines.push(
                `HOJA IGNORADA: ${sheetName}`
            );

            continue;

        }


        const sheet =
            wb.Sheets[sheetName];


        const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    header: 1,
                    defval: "",
                    raw: false
                }
            );


        debugLines.push(
            `\n================================`
        );

        debugLines.push(
            `HOJA: ${sheetName}`
        );

        debugLines.push(
            `Filas: ${rows.length}`
        );

        debugLines.push(
            `================================`
        );


        const provider =
            findProvider(rows);


        debugLines.push(
            `Proveedor: ${
                provider.name ||
                "(no detectado)"
            }`
        );


        if (provider.ruc) {

            debugLines.push(
                `RUC: ${provider.ruc}`
            );

        }


        if (provider.ci) {

            debugLines.push(
                `C.I.: ${provider.ci}`
            );

        }


        const parsed =
            parseSheet(
                rows,
                sheetName
            );


        for (
            const result of parsed.results
        ) {

            result.provider =
                provider;

            allResults.push(result);

        }


        debugLines.push(
            ...parsed.debugLines
        );

    }


    return {

        results:
            mergeResults(allResults),

        debugLines

    };

}


/*
    Nombre del catálogo.

    Actualmente se mantiene el código.
*/
function catalogName(code) {

    return code;

}


/*
    Construir filas CSV.
*/
function buildCSVRows(lots) {

    const rows = [];


    for (const lotData of lots) {

        const lot =
            lotData.lot;


        for (const item of lotData.items) {

            const common = {

                "Número Lote":
                    lot.number,

                "Número Grupo":
                    lot.group,

                "Número Item":
                    item.item,

                "Código de Producto":
                    item.code,

                "Grupo Descripción":
                    "Mantenimiento de Edificios de las Facultades - UNI 2026",

                "Nombre del Producto":
                    item.description
                        ? item.description +
                          " - En Catálogo: " +
                          catalogName(item.code)
                        : "En Catálogo: " +
                          catalogName(item.code),

                "Cantidad":
                    "_NO_APLICA_",

                "Contrato Abierto":
                    "Si",

                "Abastecimiento Simultáneo":
                    lot.simultaneous || "No",

                "Tipo Contrato Abierto":
                    lot.contractType || "",

                "Cantidad Adjudicada":
                    "_NO_APLICA_",

                "Porcentaje de Distribución":
                    "_NO_APLICA_",

                "Precio Unitario Adjudicado":
                    "",

                "Atributo":
                    "",

                "Descripción Atributo":
                    ""

            };


            rows.push({
                ...common
            });


            /*
                Procedencia.
            */
            if (item.procedencia) {

                rows.push({

                    ...common,

                    "Atributo":
                        "procedencia",

                    "Descripción Atributo":
                        item.procedencia

                });

            }


            /*
                Certificado.
            */
            if (item.certificado) {

                rows.push({

                    ...common,

                    "Atributo":
                        "nro_certificado_origen_nacional",

                    "Descripción Atributo":
                        item.certificado

                });

            }

        }

    }


    return rows;

}


/*
    CSV seguro.
*/
function csvEscape(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }


    const text =
        String(value);


    if (
        /[",\r\n]/.test(text)
    ) {

        return '"' +
            text.replace(
                /"/g,
                '""'
            ) +
            '"';

    }


    return text;

}


function createCSV(rows) {

    const lines = [];


    lines.push(
        OUTPUT_HEADERS
            .map(csvEscape)
            .join(",")
    );


    for (const row of rows) {

        lines.push(
            OUTPUT_HEADERS
                .map(
                    header =>
                        csvEscape(
                            row[header]
                        )
                )
                .join(",")
        );

    }


    return "\uFEFF" +
        lines.join("\r\n");

}


/*
    Vista previa.
*/
function showPreview(rows) {

    previewTable.innerHTML = "";


    if (!rows.length) {
        return;
    }


    const thead =
        document.createElement("thead");


    const headRow =
        document.createElement("tr");


    for (const header of OUTPUT_HEADERS) {

        const th =
            document.createElement("th");

        th.textContent =
            header;

        headRow.appendChild(th);

    }


    thead.appendChild(headRow);

    previewTable.appendChild(thead);


    const tbody =
        document.createElement("tbody");


    for (
        const row of rows.slice(0, 300)
    ) {

        const tr =
            document.createElement("tr");


        for (const header of OUTPUT_HEADERS) {

            const td =
                document.createElement("td");


            td.textContent =
                row[header] ?? "";


            tr.appendChild(td);

        }


        tbody.appendChild(tr);

    }


    previewTable.appendChild(tbody);

}


/*
    Procesar archivo.
*/
async function processFile(file) {

    message.innerHTML = "";

    debug.textContent = "";

    stats.innerHTML = "";

    previewTable.innerHTML = "";

    downloadArea.innerHTML = "";


    try {

        const buffer =
            await file.arrayBuffer();


        workbook =
            XLSX.read(
                buffer,
                {
                    type: "array",
                    cellDates: false
                }
            );


        debug.textContent =
            `Hojas encontradas:\n\n` +
            workbook.SheetNames
                .map(
                    x => `• ${x}`
                )
                .join("\n");


        const parsed =
            parseWorkbook(workbook);


        parsedLots =
            parsed.results;


        debug.textContent =
            parsed.debugLines.join("\n");


        if (!parsedLots.length) {

            setMessage(
                "error",
                "El Excel fue abierto correctamente, pero no se detectaron lotes con ítems adjudicados."
            );

            generateBtn.disabled = true;

            return;

        }


        const itemCount =
            parsedLots.reduce(
                (sum, lot) =>
                    sum + lot.items.length,
                0
            );


        const lotCount =
            parsedLots.length;


        stats.innerHTML = `

            <div class="stat">
                <strong>Lotes:</strong>
                ${lotCount}
            </div>

            <div class="stat">
                <strong>Ítems:</strong>
                ${itemCount}
            </div>

            <div class="stat">
                <strong>Hojas procesadas:</strong>
                ${
                    workbook.SheetNames.length
                }
            </div>

        `;


        message.innerHTML = `

            <div class="success">

                Excel procesado correctamente.

                <br><br>

                <strong>
                    ${lotCount}
                </strong>
                lote(s) detectado(s).

                <br>

                <strong>
                    ${itemCount}
                </strong>
                ítem(s) detectado(s).

            </div>

        `;


        generateBtn.disabled = false;


    } catch (error) {

        console.error(error);


        message.innerHTML = `

            <div class="error">

                Error al leer el Excel:

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;


        debug.textContent =
            error.stack ||
            String(error);


        generateBtn.disabled = true;

    }

}


/*
    Generar.
*/
generateBtn.addEventListener(
    "click",
    () => {

        if (
            !parsedLots.length
        ) {

            return;

        }


        try {

            const rows =
                buildCSVRows(
                    parsedLots
                );


            const csv =
                createCSV(rows);


            const blob =
                new Blob(
                    [csv],
                    {
                        type:
                            "text/csv;charset=utf-8;"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            downloadArea.innerHTML = `

                <a
                    class="download"
                    href="${url}"
                    download="licitacion_484012.csv"
                >
                    ⬇ Descargar CSV
                </a>

            `;


            showPreview(rows);


            stats.innerHTML += `

                <div class="stat">
                    <strong>
                        Filas CSV:
                    </strong>
                    ${rows.length}
                </div>

            `;


            message.innerHTML = `

                <div class="success">

                    CSV generado correctamente.

                    <br>

                    ${rows.length}
                    filas generadas.

                </div>

            `;

        } catch (error) {

            console.error(error);

            message.innerHTML = `

                <div class="error">

                    Error al generar CSV:
                    ${escapeHTML(
                        error.message
                    )}

                </div>

            `;

        }

    }
);


function setMessage(
    type,
    text
) {

    message.innerHTML =
        `<div class="${type}">${text}</div>`;

}


function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
