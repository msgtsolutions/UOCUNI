<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador CSV</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

.subtitle {
    color: #6b7280;
    margin-bottom: 25px;
}

.upload-box {
    border: 2px dashed #9ca3af;
    border-radius: 12px;
    padding: 35px 20px;
    text-align: center;
    cursor: pointer;
    background: #f9fafb;
}

.upload-box:hover,
.upload-box.dragover {
    border-color: #2563eb;
    background: #eff6ff;
}

.upload-box strong {
    display: block;
    font-size: 18px;
    margin-bottom: 8px;
}

.upload-box span {
    color: #6b7280;
    font-size: 14px;
}

input[type="file"] {
    display: none;
}

.form-group {
    margin-top: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    background: white;
}

button {
    margin-top: 22px;
    width: 100%;
    border: 0;
    border-radius: 8px;
    padding: 14px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.status {
    margin-top: 20px;
    padding: 12px;
    border-radius: 8px;
    display: none;
    white-space: pre-wrap;
}

.status.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.status.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.status.info {
    display: block;
    background: #dbeafe;
    color: #1e40af;
}

.info-box {
    margin-top: 20px;
    background: #f3f4f6;
    padding: 15px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
}

.preview {
    margin-top: 25px;
    display: none;
}

.preview h2 {
    font-size: 18px;
}

.preview pre {
    background: #111827;
    color: #e5e7eb;
    padding: 15px;
    border-radius: 8px;
    overflow: auto;
    max-height: 350px;
    font-size: 12px;
}

.file-name {
    margin-top: 12px;
    font-size: 14px;
    color: #374151;
    word-break: break-all;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Generador CSV</h1>

        <div class="subtitle">
            Licitación 484012 — Mantenimiento de Edificios de las Facultades - UNI 2026
        </div>

        <label class="upload-box" id="uploadBox" for="fileInput">
            <strong>Seleccionar archivo Excel</strong>
            <span>Haz clic aquí o arrastra un archivo .xlsx o .xls</span>
            <div class="file-name" id="fileName"></div>
        </label>

        <input
            type="file"
            id="fileInput"
            accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"
        >

        <div class="form-group">
            <label for="lotSelect">Lote</label>
            <select id="lotSelect" disabled>
                <option value="">Primero carga el Excel</option>
            </select>
        </div>

        <div class="form-group">
            <label for="rucInput">RUC</label>
            <input
                type="text"
                id="rucInput"
                placeholder="Ingrese el RUC"
            >
        </div>

        <div class="form-group">
            <label for="providerInput">Proveedor</label>
            <input
                type="text"
                id="providerInput"
                placeholder="Se obtiene automáticamente del Excel"
            >
        </div>

        <div class="info-box">
            <strong>Información:</strong><br>
            El archivo debe contener las hojas correspondientes a los lotes
            adjudicados. Se generarán las filas principales y sus atributos.
        </div>

        <button id="generateBtn" disabled>
            Generar CSV
        </button>

        <div id="status" class="status"></div>

        <div class="preview" id="preview">
            <h2>Vista previa</h2>
            <pre id="previewContent"></pre>
        </div>

    </div>
</div>

<script>

const fileInput = document.getElementById("fileInput");
const uploadBox = document.getElementById("uploadBox");
const fileName = document.getElementById("fileName");
const lotSelect = document.getElementById("lotSelect");
const rucInput = document.getElementById("rucInput");
const providerInput = document.getElementById("providerInput");
const generateBtn = document.getElementById("generateBtn");
const statusBox = document.getElementById("status");
const preview = document.getElementById("preview");
const previewContent = document.getElementById("previewContent");

let workbook = null;
let lots = [];


/* =========================================================
   ENCABEZADOS DEL CSV
========================================================= */

const CSV_HEADERS = [
    "Número Lote",
    "Número Grupo",
    "Número Item",
    "Código de Producto",
    "Grupo Descripción",
    "Nombre del Producto",
    "Cantidad",
    "Contrato Abierto",
    "Abastecimiento Simultáneo",
    "Tipo Contrato Abierto",
    "Cantidad Adjudicada",
    "Porcentaje de Distribución",
    "Precio Unitario Adjudicado",
    "Atributo",
    "Descripción Atributo"
];


/* =========================================================
   CATÁLOGO
========================================================= */

const CATALOG = {
    "72101601-001": "Reparacion de techo",
    "72101607-002": "Revestimiento de pared o muros",
    "72102201-002": "Mantenimiento y reparacion de instalaciones electricas",
    "72102304-001": "Mantenimiento y reparacion de Instalaciones sanitarias",
    "72102602-004": "Colocacion de vidrios",
    "72103003-001": "Servicio de Demolicion",
    "72131601-002": "Preparacion de obra",
    "72131601-005": "Mamposteria",
    "72131601-008": "Revoques",
    "72131601-009": "Colocacion de pisos - contrapisos",
    "72131601-010": "Aberturas",
    "72131601-012": "Servicio de pintura",
    "72131601-013": "Limpieza de obra",
    "80111613-9999": "Mano de Obra - Mantenimiento y/o reparación",
    "92121702-001": "Mantenimiento y reparacion de Instalaciones electricas"
};


/* =========================================================
   UTILIDADES
========================================================= */

function normalizeText(value) {
    return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
}


function cleanText(value) {
    return String(value ?? "")
        .replace(/\r/g, " ")
        .replace(/\n/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/*
   IMPORTANTE:
   Si el Excel contiene:

   Adjudicado: EMPRESA XYZ

   el CSV tendrá:

   PROVEEDOR: EMPRESA XYZ

   y NO:

   PROVEEDOR: Adjudicado: EMPRESA XYZ
*/

function cleanProvider(value) {

    let text = cleanText(value);

    const match = text.match(
        /adjudicado\s*:\s*(.*)$/i
    );

    if (match) {
        text = match[1].trim();
    }

    text = text.replace(
        /^adjudicado\s*:\s*/i,
        ""
    );

    return text.trim();
}


/*
   TODAS las columnas del CSV quedan entre comillas.
*/

function csvEscape(value) {

    if (value === null || value === undefined) {
        value = "";
    }

    let text = String(value);

    text = text.replace(/"/g, '""');

    return `"${text}"`;
}


function csvRow(values) {
    return values.map(csvEscape).join(",");
}


function isPositiveInteger(value) {

    const text = cleanText(value);

    return /^\d+$/.test(text) && Number(text) > 0;
}


function catalogName(code) {

    return CATALOG[cleanText(code)] || "";
}


/* =========================================================
   LOTES
========================================================= */

function getLotNumber(text) {

    const match = String(text || "").match(
        /lote\s+(I{1,3})\b/i
    );

    if (!match) {
        return null;
    }

    const roman = match[1].toUpperCase();

    if (roman === "I") return 1;
    if (roman === "II") return 2;
    if (roman === "III") return 3;

    return null;
}


function findLotText(row) {

    for (const cell of row) {

        const text = cleanText(cell);

        if (!text) {
            continue;
        }

        if (/lote\s+(I{1,3})\b/i.test(text)) {
            return text;
        }
    }

    return "";
}


function parseLotHeader(text) {

    const clean = cleanText(text);

    const number = getLotNumber(clean);

    if (!number) {
        return null;
    }

    let group = "";

    const groupMatch = clean.match(
        /grupo\s+(\d+)/i
    );

    if (groupMatch) {
        group = groupMatch[1];
    }

    let faculty = clean
        .replace(
            /lote\s+(I{1,3})\s*-\s*/i,
            ""
        )
        .replace(
            /\s*-\s*grupo\s+\d+.*$/i,
            ""
        )
        .trim();

    return {
        number,
        group,
        faculty,
        sourceText: clean
    };
}


/* =========================================================
   ENCABEZADO DE ITEMS
========================================================= */

function findItemHeader(row) {

    let itemIndex = -1;
    let codeIndex = -1;

    row.forEach((cell, index) => {

        const text = normalizeText(cell);

        if (
            itemIndex === -1 &&
            text === "item"
        ) {
            itemIndex = index;
        }

        if (
            codeIndex === -1 &&
            (
                text === "codigo catalogo" ||
                text === "codigo de catalogo" ||
                text.includes("codigo catalogo")
            )
        ) {
            codeIndex = index;
        }
    });

    if (
        itemIndex !== -1 &&
        codeIndex !== -1
    ) {
        return {
            itemIndex,
            codeIndex
        };
    }

    return null;
}


/* =========================================================
   PROVEEDOR
========================================================= */

function extractProvider(rows) {

    for (
        let i = 0;
        i < Math.min(rows.length, 30);
        i++
    ) {

        const row = rows[i];

        for (const cell of row) {

            const text = cleanText(cell);

            if (!text) {
                continue;
            }

            if (/adjudicado\s*:/i.test(text)) {
                return cleanProvider(text);
            }
        }
    }

    return "";
}


/* =========================================================
   RUC
========================================================= */

function extractRuc(rows) {

    for (
        let i = 0;
        i < Math.min(rows.length, 30);
        i++
    ) {

        const row = rows[i];

        const joined = row
            .map(cleanText)
            .filter(Boolean)
            .join(" ");

        const match = joined.match(
            /ruc\s*[:\-]?\s*([0-9]+(?:-[0-9kK])?)/i
        );

        if (match) {
            return match[1];
        }
    }

    return "";
}


/* =========================================================
   EXTRAER LOTES Y ITEMS
========================================================= */

function extractLots(workbook) {

    const result = [];

    for (const sheetName of workbook.SheetNames) {

        const normalizedSheet =
            normalizeText(sheetName);

        if (
            normalizedSheet.startsWith("items")
        ) {
            continue;
        }

        const ws = workbook.Sheets[sheetName];

        const rows = XLSX.utils.sheet_to_json(
            ws,
            {
                header: 1,
                defval: "",
                raw: true
            }
        );

        if (!rows.length) {
            continue;
        }

        let currentLot = null;
        let itemHeader = null;

        const provider =
            extractProvider(rows);

        const ruc =
            extractRuc(rows);

        /*
          Si la hoja se llama Lote I,
          Lote II o Lote III.
        */

        const sheetLotNumber =
            getLotNumber(sheetName);

        if (sheetLotNumber) {

            currentLot = {
                number: sheetLotNumber,
                group: "",
                faculty: "",
                sourceText: sheetName
            };
        }

        for (
            let r = 0;
            r < rows.length;
            r++
        ) {

            const row = rows[r];

            if (!Array.isArray(row)) {
                continue;
            }

            /*
              Buscar lote en cualquier celda.
            */

            const lotText =
                findLotText(row);

            if (lotText) {

                const parsed =
                    parseLotHeader(lotText);

                if (parsed) {

                    currentLot = parsed;

                    itemHeader = null;
                }
            }

            /*
              Buscar encabezado de artículos.
            */

            const detectedHeader =
                findItemHeader(row);

            if (detectedHeader) {

                itemHeader =
                    detectedHeader;

                if (
                    !currentLot &&
                    sheetLotNumber
                ) {

                    currentLot = {
                        number: sheetLotNumber,
                        group: "",
                        faculty: "",
                        sourceText: sheetName
                    };
                }

                continue;
            }

            if (
                !currentLot ||
                !itemHeader
            ) {
                continue;
            }

            const itemValue =
                row[itemHeader.itemIndex];

            const codeValue =
                row[itemHeader.codeIndex];

            if (
                !isPositiveInteger(itemValue)
            ) {
                continue;
            }

            const itemNumber =
                cleanText(itemValue);

            const code =
                cleanText(codeValue);

            if (!code) {
                continue;
            }

            /*
              Datos posteriores al código de catálogo.
            */

            const description =
                cleanText(
                    row[itemHeader.codeIndex + 1]
                );

            const quantity =
                cleanText(
                    row[itemHeader.codeIndex + 2]
                );

            const amount =
                cleanText(
                    row[itemHeader.codeIndex + 3]
                );

            result.push({

                lot: {
                    number: currentLot.number,
                    group: currentLot.group || "1",
                    faculty: currentLot.faculty || ""
                },

                item: {
                    item: itemNumber,
                    code: code,
                    description: description,
                    quantity: quantity,
                    amount: amount
                },

                provider: provider,
                ruc: ruc,
                sheet: sheetName
            });
        }
    }

    /*
      Ordenar por lote e item.
    */

    result.sort((a, b) => {

        const lotA =
            Number(a.lot.number);

        const lotB =
            Number(b.lot.number);

        if (lotA !== lotB) {
            return lotA - lotB;
        }

        return (
            Number(a.item.item) -
            Number(b.item.item)
        );
    });

    /*
      Eliminar duplicados.
    */

    const unique = [];
    const seen = new Set();

    for (const item of result) {

        const key = [
            item.lot.number,
            item.lot.group,
            item.item.item,
            item.item.code,
            item.sheet
        ].join("|");

        if (!seen.has(key)) {

            seen.add(key);

            unique.push(item);
        }
    }

    return unique;
}


/* =========================================================
   CARGA DEL ARCHIVO
========================================================= */

fileInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (file) {
            processFile(file);
        }
    }
);


uploadBox.addEventListener(
    "dragover",
    function(event) {

        event.preventDefault();

        uploadBox.classList.add(
            "dragover"
        );
    }
);


uploadBox.addEventListener(
    "dragleave",
    function() {

        uploadBox.classList.remove(
            "dragover"
        );
    }
);


uploadBox.addEventListener(
    "drop",
    function(event) {

        event.preventDefault();

        uploadBox.classList.remove(
            "dragover"
        );

        const file =
            event.dataTransfer.files[0];

        if (file) {
            processFile(file);
        }
    }
);


async function processFile(file) {

    clearStatus();

    const name =
        file.name.toLowerCase();

    if (
        !name.endsWith(".xlsx") &&
        !name.endsWith(".xls")
    ) {

        showStatus(
            "El archivo debe ser .xlsx o .xls.",
            "error"
        );

        return;
    }

    fileName.textContent =
        "Archivo: " + file.name;

    showStatus(
        "Leyendo archivo Excel...",
        "info"
    );

    try {

        const buffer =
            await file.arrayBuffer();

        workbook = XLSX.read(
            buffer,
            {
                type: "array",
                cellDates: false
            }
        );

        console.log(
            "Hojas encontradas:",
            workbook.SheetNames
        );

        lots =
            extractLots(workbook);

        console.log(
            "Registros encontrados:",
            lots
        );

        if (!lots.length) {

            throw new Error(
                "No se encontraron lotes adjudicados ni artículos en el Excel."
            );
        }

        const first =
            lots[0];

        if (
            first.provider &&
            !providerInput.value.trim()
        ) {

            providerInput.value =
                cleanProvider(
                    first.provider
                );
        }

        if (
            first.ruc &&
            !rucInput.value.trim()
        ) {

            rucInput.value =
                first.ruc;
        }

        populateLotSelector();

        generateBtn.disabled = false;

        showStatus(
            "Excel cargado correctamente. Se encontraron " +
            lots.length +
            " artículos.",
            "success"
        );

    } catch (error) {

        console.error(error);

        showStatus(
            "No se pudo leer el Excel:\n" +
            error.message,
            "error"
        );

        generateBtn.disabled = true;
    }
}


/* =========================================================
   SELECTOR DE LOTES
========================================================= */

function populateLotSelector() {

    const lotNumbers = [
        ...new Set(
            lots.map(
                item => item.lot.number
            )
        )
    ].sort(
        (a, b) => a - b
    );

    lotSelect.innerHTML = "";

    if (!lotNumbers.length) {

        lotSelect.innerHTML =
            '<option value="">No hay lotes</option>';

        lotSelect.disabled = true;

        return;
    }

    lotSelect.disabled = false;

    for (const number of lotNumbers) {

        const option =
            document.createElement(
                "option"
            );

        option.value = number;

        option.textContent =
            "Lote " + number;

        lotSelect.appendChild(
            option
        );
    }
}


/* =========================================================
   GENERAR CSV
========================================================= */

generateBtn.addEventListener(
    "click",
    function() {

        if (!lots.length) {
            return;
        }

        const selectedLot =
            Number(lotSelect.value);

        const selectedItems =
            lots.filter(
                item =>
                    Number(
                        item.lot.number
                    ) === selectedLot
            );

        if (!selectedItems.length) {

            showStatus(
                "No hay artículos para el lote seleccionado.",
                "error"
            );

            return;
        }

        /*
          LIMPIAR PROVEEDOR
        */

        let provider =
            cleanProvider(
                providerInput.value
            );

        const ruc =
            cleanText(
                rucInput.value
            );

        if (!provider) {

            provider =
                cleanProvider(
                    selectedItems[0].provider
                );
        }

        const lines = [];

        /*
          METADATOS
        */

        lines.push(
            csvRow([
                "LICITACIÓN: 484012 - Mantenimiento de Edificios de las Facultades - UNI 2026"
            ])
        );

        lines.push(
            csvRow([
                "SISTEMA DE ADJUDICACIÓN:  lote"
            ])
        );

        lines.push(
            csvRow([
                "PROVEEDOR: " +
                provider +
                " - RUC: " +
                ruc
            ])
        );

        lines.push(
            csvRow([
                "OBSERVACIÓN: En caso de que una fila no sera cargada eliminar la fila y los atributos de la lista. "
            ])
        );

        lines.push("");

        /*
          ENCABEZADOS
          
          IMPORTANTE:
          csvRow() agrega las comillas dobles,
          por lo tanto queda exactamente:

          "Número Lote"
        */

        lines.push(
            csvRow(CSV_HEADERS)
        );

        /*
          ITEMS
        */

        for (
            const data of selectedItems
        ) {

            const lotNumber =
                data.lot.number;

            const groupNumber =
                data.lot.group || "1";

            const itemNumber =
                data.item.item;

            const code =
                data.item.code;

            const description =
                data.item.description;

            const catalog =
                catalogName(code);

            let productName =
                description;

            if (catalog) {

                productName =
                    description +
                    " - En Catálogo: " +
                    catalog;
            }

            /*
              FILA PRINCIPAL
            */

            lines.push(
                csvRow([
                    lotNumber,
                    groupNumber,
                    itemNumber,
                    code,
                    "Mantenimiento de Edificios de las Facultades - UNI 2026",
                    productName,
                    "_NO_APLICA_",
                    "Si",
                    "No",
                    data.item.amount || "",
                    "_NO_APLICA_",
                    "_NO_APLICA_",
                    "",
                    "",
                    ""
                ])
            );

            /*
              ATRIBUTO PROCEDENCIA
            */

            lines.push(
                csvRow([
                    lotNumber,
                    groupNumber,
                    itemNumber,
                    code,
                    "Mantenimiento de Edificios de las Facultades - UNI 2026",
                    productName,
                    "_NO_APLICA_",
                    "Si",
                    "No",
                    data.item.amount || "",
                    "_NO_APLICA_",
                    "_NO_APLICA_",
                    "",
                    "procedencia",
                    ""
                ])
            );

            /*
              ATRIBUTO CERTIFICADO
            */

            lines.push(
                csvRow([
                    lotNumber,
                    groupNumber,
                    itemNumber,
                    code,
                    "Mantenimiento de Edificios de las Facultades - UNI 2026",
                    productName,
                    "_NO_APLICA_",
                    "Si",
                    "No",
                    data.item.amount || "",
                    "_NO_APLICA_",
                    "_NO_APLICA_",
                    "",
                    "nro_certificado_origen_nacional",
                    ""
                ])
            );
        }

        /*
          UTF-8 BOM
        */

        const csvContent =
            "\uFEFF" +
            lines.join("\r\n");

        const blob =
            new Blob(
                [csvContent],
                {
                    type:
                        "text/csv;charset=utf-8;"
                }
            );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "484012-Mantenimiento-de-Edificios-de-las-Facultades-UNI-2026-Lote-" +
            selectedLot +
            ".csv";

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);

        /*
          VISTA PREVIA
        */

        preview.style.display =
            "block";

        previewContent.textContent =
            lines
                .slice(0, 16)
                .join("\n");

        showStatus(
            "CSV generado correctamente para el Lote " +
            selectedLot +
            ".",
            "success"
        );
    }
);


/* =========================================================
   ESTADO
========================================================= */

function showStatus(
    message,
    type
) {

    statusBox.textContent =
        message;

    statusBox.className =
        "status " + type;
}


function clearStatus() {

    statusBox.textContent = "";

    statusBox.className =
        "status";

    preview.style.display =
        "none";

    previewContent.textContent =
        "";
}

</script>
