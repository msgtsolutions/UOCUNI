<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convertidor XLSX → CSV</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#17202a}
.container{max-width:1100px;margin:35px auto;padding:0 18px}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:18px}
h1{margin:0 0 8px;font-size:26px}
.subtitle{color:#68737d;margin-bottom:22px}
label{display:block;font-weight:700;margin:15px 0 7px}
input[type=file],select,input[type=text]{width:100%;padding:11px;border:1px solid #ccd3d9;border-radius:8px;background:#fff;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
button{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}
.primary{background:#1769e0;color:white}
.secondary{background:#e9edf1;color:#17202a}
button:disabled{opacity:.45;cursor:not-allowed}
.status{padding:12px;border-radius:8px;background:#eef5ff;margin-top:15px;font-size:14px}
.error{background:#fff0f0;color:#a30000}
.ok{background:#edf9f0;color:#176b2d}
.preview{overflow:auto;max-height:440px;border:1px solid #dde2e6;border-radius:8px;margin-top:15px}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th,td{border-bottom:1px solid #e5e8eb;padding:8px 10px;text-align:left}
th{background:#f0f3f5;position:sticky;top:0;z-index:1}
.small{font-size:12px;color:#68737d}
.hidden{display:none}
.check{display:flex;align-items:center;gap:8px;margin-top:15px}
.check input{width:auto}
@media(max-width:700px){.grid{grid-template-columns:1fr}.container{margin-top:15px}.card{padding:17px}}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>XLSX → CSV</h1>
    <div class="subtitle">Generador del CSV con la estructura exacta del formato de carga.</div>

    <label for="xlsx">Archivo Excel (.xlsx)</label>
    <input id="xlsx" type="file" accept=".xlsx,.xls">

    <div id="sheetArea" class="hidden">
      <div class="grid">
        <div>
          <label for="sheet">Hoja</label>
          <select id="sheet"></select>
        </div>
        <div>
          <label for="section">Lote / sección</label>
          <select id="section"></select>
        </div>
      </div>

      <div class="check">
        <input id="allSheets" type="checkbox">
        <span>Procesar todos los lotes detectados de todas las hojas</span>
      </div>

      <div class="grid">
        <div>
          <label for="ruc">RUC del proveedor</label>
          <input id="ruc" type="text" placeholder="Ej.: 80048624">
          <div class="small">Si el RUC no aparece en el Excel, se puede introducir aquí.</div>
        </div>
        <div>
          <label for="supplier">Proveedor</label>
          <input id="supplier" type="text" placeholder="Se detecta automáticamente">
        </div>
      </div>

      <div class="grid">
        <div>
          <label for="system">Sistema de adjudicación</label>
          <input id="system" type="text" value="lote">
        </div>
        <div>
          <label for="fileName">Nombre del CSV</label>
          <input id="fileName" type="text" value="salida.csv">
        </div>
      </div>

      <div id="status" class="status">Seleccione una hoja y un lote.</div>

      <div class="buttons">
        <button class="primary" id="download" disabled>Generar y descargar CSV</button>
        <button class="secondary" id="previewBtn" disabled>Actualizar vista previa</button>
      </div>
    </div>
  </div>

  <div class="card">
    <strong>Vista previa</strong>
    <div id="preview" class="preview">
      <div style="padding:18px;color:#68737d">Cargue un archivo Excel para comenzar.</div>
    </div>
  </div>
</div>

<script>
let workbook = null;
let sheetsData = {};
let detected = [];

const OUTPUT_HEADERS = [
 "Número Lote","Número Grupo","Número Item","Código de Producto",
 "Grupo Descripción","Nombre del Producto","Cantidad","Contrato Abierto",
 "Abastecimiento Simultáneo","Tipo Contrato Abierto","Cantidad Adjudicada",
 "Porcentaje de Distribución","Precio Unitario Adjudicado","Atributo",
 "Descripción Atributo"
];

const $ = id => document.getElementById(id);

function norm(v){
  return String(v ?? "")
    .normalize("NFD").replace(/[\\u0300-\\u036f]/g,"")
    .toLowerCase().trim();
}
function text(v){ return String(v ?? "").trim(); }

function findHeader(rows){
  const aliases={
    item:["item","ítem","n item","numero item","número item"],
    code:["codigo catalogo","código catalogo","codigo de catalogo","código de catálogo","codigo producto","código producto"],
    desc:["descripcion","descripción","descripcion del producto","descripción del producto","nombre del producto"]
  };
  const clean=v=>String(v??"").replace(/\r?\n/g," ").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
  const match=(v,a)=>a.some(x=>{x=clean(x); return clean(v)===x||clean(v).includes(x)});
  for(let i=0;i<Math.min(rows.length,200);i++){
    let f={item:false,code:false,desc:false};
    (rows[i]||[]).forEach(v=>{
      if(match(v,aliases.item))f.item=true;
      if(match(v,aliases.code))f.code=true;
      if(match(v,aliases.desc))f.desc=true;
    });
    if(f.item&&f.code&&f.desc)return i;
  }
  for(let i=0;i<Math.min(rows.length-1,200);i++){
    const a=(rows[i]||[]),b=(rows[i+1]||[]);
    let f={item:false,code:false,desc:false};
    for(let j=0;j<Math.max(a.length,b.length);j++){
      const v=clean((a[j]||"")+" "+(b[j]||""));
      if(match(v,aliases.item))f.item=true;
      if(match(v,aliases.code))f.code=true;
      if(match(v,aliases.desc))f.desc=true;
    }
    if(f.item&&f.code&&f.desc)return i+1;
  }
  return -1;
}

function parseNumber(v){
  if(typeof v==="number") return v;
  const s=text(v).replace(/\./g,"").replace(",",".");
  const n=Number(s);
  return Number.isFinite(n) ? n : null;
}

function parseLotMarker(v){
  const s=String(v??"").replace(/\s+/g," ").trim();
  const m=s.match(/\bLote(?:s)?\s+([IVXLCDM]+|\d+)\b/i);
  if(!m)return null;
  const g=s.match(/\bgrupo\s*([0-9]+)/i);
  const ca=s.match(/Contrato\s+Abierto\s*:\s*([^,|]+)/i);
  const as=s.match(/Abastecimiento\s+Simult[aá]neo\s*:\s*([^,|]+)/i);
  return {lote:m[1].toUpperCase(),grupo:g?g[1]:"1",marker:s,contrato:"Si",
          simultaneo:as?( /^si$/i.test(as[1].trim())?"Si":"No"):"No",tipo:"monto"};
}

function parseAttributes(v){
  const out=[],s=String(v??"").replace(/\r/g,"");
  if(!s.trim())return out;
  s.split(/\n|;(?=\s*[A-Za-zÁÉÍÓÚÑáéíóúñ][^;:]{0,80}:)/).forEach(line=>{
    line=line.trim(); if(!line)return;
    const p=line.indexOf(":"),key=(p>=0?line.slice(0,p):line).trim();
    if(key&&!/^caracter[ií]sticas?$/i.test(key))out.push(key);
  });
  return [...new Set(out)];
}

function catalogName(desc){
  // En el CSV de referencia: Nombre + " - En Catálogo: " + primer
  // segmento descriptivo.
  const s=text(desc);
  const p=s.indexOf(" - ");
  return p>=0 ? s.slice(0,p).trim() : s;
}

function detectSheet(name){
  const rows=sheetsData[name], header=findHeader(rows);
  const sections=[]; let current=null;
  const dataRow=r=>{
    if(!r)return false;
    const item=String(r[0]??"").trim(),code=String(r[1]??"").trim(),desc=String(r[2]??"").trim();
    return /^\d+(?:[.,]\d+)?$/.test(item)&&code.length>0&&desc.length>0;
  };
  const scan=(from)=>{
    let cur=null,out=[];
    for(let i=from;i<rows.length;i++){
      const r=rows[i]||[];
      let marker=null;
      for(const v of r){marker=parseLotMarker(v);if(marker)break}
      if(marker){
        if(cur&&cur.items.length)out.push(cur);
        cur={...marker,start:i,items:[]}; continue;
      }
      if(dataRow(r)){
        if(!cur)cur={lote:"",grupo:"1",marker:"",contrato:"Si",simultaneo:"No",tipo:"monto",start:i,items:[]};
        let attr=r[5]??"";
        if(!String(attr).trim()){
          for(let c=3;c<r.length;c++) if(String(r[c]??"").includes(":")) {attr=r[c];break}
        }
        cur.items.push({item:parseNumber(r[0]),code:String(r[1]).trim(),desc:String(r[2]).trim(),attrs:parseAttributes(attr),row:i});
      }
    }
    if(cur&&cur.items.length)out.push(cur);
    return out;
  };
  let from=header>=0?header+1:0;
  let result=scan(from);
  if(!result.length)result=scan(0);
  return {header,sections:result};
}

function parseWorkbook(){
  sheetsData={};
  detected=[];
  workbook.SheetNames.forEach(name=>{
    const ws=workbook.Sheets[name];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
    sheetsData[name]=rows;
    const d=detectSheet(name);
    if(d.sections.length) detected.push({name,...d});
  });
}

function getSupplier(){
  for(const name of workbook.SheetNames){
    const rows=sheetsData[name];
    for(const r of rows){
      const label=norm(r[1]);
      if(label==="adjudicado" || label==="proveedor"){
        const v=text(r[3] ?? r[2] ?? "");
        if(v) return v.replace(/\s*-\s*$/,"").trim();
      }
    }
  }
  return "";
}

function getLicitacion(){
  for(const name of workbook.SheetNames){
    for(const r of sheetsData[name]){
      const s=text(r[0] ?? r[1] ?? "");
      if(/^licitacion\\s*:/i.test(s)) return s.replace(/^licitacion\\s*:\\s*/i,"").trim();
    }
  }
  return "";
}

function populateSheets(){
  $("sheet").innerHTML="";
  detected.forEach((d,i)=>{
    const o=document.createElement("option");
    o.value=d.name;o.textContent=`${d.name} (${d.sections.length} lote(s))`;
    $("sheet").appendChild(o);
  });
  if(detected.length){
    $("sheet").value=detected[0].name;
    populateSections();
  }
}

function populateSections(){
  const d=detected.find(x=>x.name===$("sheet").value);
  $("section").innerHTML="";
  if(!d) return;
  d.sections.forEach((s,i)=>{
    const o=document.createElement("option");
    o.value=i;
    const label=s.lote ? `Lote ${s.lote}` : `Sección ${i+1}`;
    o.textContent=`${label} — ${s.items.length} ítem(s)`;
    $("section").appendChild(o);
  });
  updateUI();
}

function selectedSections(){
  if($("allSheets").checked){
    return detected.flatMap(d=>d.sections.map((s,i)=>({sheet:d.name,section:i,data:s})));
  }
  const d=detected.find(x=>x.name===$("sheet").value);
  const i=Number($("section").value);
  return d && d.sections[i] ? [{sheet:d.name,section:i,data:d.sections[i]}] : [];
}

function makeRows(){
  const result=[];
  selectedSections().forEach(sel=>{
    const s=sel.data;
    s.items.forEach(it=>{
      const base=[
        s.lote, s.grupo, it.item, it.code,
        "Mantenimiento de Edificios de las Facultades - UNI 2026",
        `${it.desc} - En Catálogo: ${catalogName(it.desc)}`,
        "_NO_APLICA_",
        "Si",
        s.simultaneo || "No",
        s.tipo || "monto",
        "_NO_APLICA_",
        "_NO_APLICA_",
        "",
        "",
        ""
      ];
      result.push(base);
      it.attrs.forEach(a=>{
        const attr=new Array(15).fill("");
        attr[13]=a;
        result.push(attr);
      });
    });
  });
  return result;
}

function csvCell(v){
  const s=String(v ?? "");
  // El formato de referencia utiliza comillas para textos y deja sin
  // comillas los marcadores especiales/números.
  if(s==="_NO_APLICA_" || /^-?\\d+(\\.\\d+)?$/.test(s)) return s;
  return `"${s.replace(/"/g,'""')}"`;
}

function buildCSV(){
  const rows=makeRows();
  const lic=getLicitacion() || "Licitación no detectada";
  const supplier=text($("supplier").value) || "Proveedor no especificado";
  const ruc=text($("ruc").value);
  const supplierLine=`PROVEEDOR: ${supplier}${ruc ? " - RUC: "+ruc : ""}`;

  const out=[];
  out.push(`"${lic.replace(/"/g,'""')}"`);
  out.push(`"SISTEMA DE ADJUDICACIÓN: ${text($("system").value) || "lote"}"`);
  out.push(`"${supplierLine.replace(/"/g,'""')}"`);
  out.push(`"OBSERVACIÓN: En caso de que una fila no sera cargada eliminar la fila y los atributos de la lista. "`);
  out.push("");
  out.push(OUTPUT_HEADERS.map(csvCell).join(";"));
  rows.forEach(r=>out.push(r.map(csvCell).join(";")));

  // BOM UTF-8 para conservar correctamente caracteres al abrir en Excel.
  return "\\uFEFF"+out.join("\\r\\n")+"\\r\\n";
}

function updateUI(){
  const sections=selectedSections();
  const count=makeRows().length;
  $("download").disabled=!sections.length;
  $("previewBtn").disabled=!sections.length;
  $("status").className="status "+(sections.length?"ok":"error");
  $("status").textContent=sections.length
    ? `${sections.length} sección(es) seleccionada(s), ${count} fila(s) de salida.`
    : "No se detectaron datos compatibles en la selección.";
  renderPreview();
}

function renderPreview(){
  const rows=makeRows();
  if(!rows.length){
    $("preview").innerHTML='<div style="padding:18px;color:#68737d">No hay datos para mostrar.</div>';
    return;
  }
  const sample=[OUTPUT_HEADERS,...rows.slice(0,15)];
  let html="<table><thead><tr>";
  html+=sample[0].map(h=>`<th>${escapeHtml(h)}</th>`).join("");
  html+="</tr></thead><tbody>";
  sample.slice(1).forEach(r=>{
    html+="<tr>"+r.map(v=>`<td>${escapeHtml(v)}</td>`).join("")+"</tr>";
  });
  html+="</tbody></table>";
  $("preview").innerHTML=html;
}

function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

$("xlsx").addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file) return;
  try{
    const buf=await file.arrayBuffer();
    workbook=XLSX.read(buf,{type:"array",cellDates:false,cellNF:true,cellStyles:true});
    parseWorkbook();

    $("sheetArea").classList.remove("hidden");
    $("supplier").value=getSupplier();
    $("fileName").value=file.name.replace(/\.(xlsx|xls)$/i,"")+".csv";

    populateSheets();

    if(!detected.length){
      $("status").className="status error";
      $("status").textContent="No se encontró una tabla compatible. El sistema busca automáticamente columnas como Ítem, Código Catálogo y Descripción.";
      $("download").disabled=true;
    }
  }catch(err){
    $("sheetArea").classList.remove("hidden");
    $("status").className="status error";
    $("status").textContent="No se pudo leer el Excel: "+err.message;
  }
});

$("sheet").addEventListener("change",populateSections);
$("section").addEventListener("change",updateUI);
$("allSheets").addEventListener("change",()=>{
  $("sheet").disabled=$("allSheets").checked;
  $("section").disabled=$("allSheets").checked;
  updateUI();
});
$("previewBtn").addEventListener("click",renderPreview);

$("download").addEventListener("click",()=>{
  const csv=buildCSV();
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  let name=text($("fileName").value)||"salida.csv";
  if(!/\.csv$/i.test(name)) name+=".csv";
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
</script>
</body>
</html>
